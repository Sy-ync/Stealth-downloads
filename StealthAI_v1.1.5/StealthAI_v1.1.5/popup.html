<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 300px;
    background: #0a0a0f;
    color: #c4b5fd;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }

  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 20px 16px; border-bottom: 1px solid #1e1830;
  }
  .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    border-radius: 7px; display: flex; align-items: center;
    justify-content: center; font-size: 14px; flex-shrink: 0;
    box-shadow: 0 0 12px rgba(124,58,237,0.4);
  }
  .header-text h1 { font-size: 14px; font-weight: 700; color: #ede9fe; letter-spacing: 0.3px; }
  .header-text p  { font-size: 10px; color: #6d28d9; margin-top: 1px; letter-spacing: 0.5px; text-transform: uppercase; }

  .body { padding: 16px 20px; }

  .label { font-size: 10px; font-weight: 600; color: #7c3aed; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }

  input[type="text"] {
    width: 100%; background: #12101f; border: 1px solid #2d1f5e; border-radius: 6px;
    color: #e9d5ff; font-family: 'Courier New', monospace; font-size: 12px;
    padding: 9px 12px; outline: none; text-align: center; letter-spacing: 2px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.2); }
  input[type="text"]::placeholder { color: #3d2f6e; letter-spacing: 1px; }

  button {
    width: 100%; margin-top: 10px;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    border: none; border-radius: 6px; color: #fff; font-size: 12px;
    font-weight: 600; padding: 9px; cursor: pointer; letter-spacing: 0.3px;
    transition: opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 12px rgba(124,58,237,0.35);
  }
  button:hover  { opacity: 0.88; box-shadow: 0 2px 16px rgba(124,58,237,0.5); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .status { margin-top: 8px; font-size: 11px; min-height: 16px; text-align: center; }
  .valid   { color: #a78bfa; }
  .invalid { color: #f87171; }
  .pending { color: #6d28d9; }

  #activated-view { display: none; }
  #activate-view  { display: block; }

  .activated-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .activated-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #7c3aed, #4c1d95);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 0 16px rgba(124,58,237,0.5); flex-shrink: 0;
  }
  .activated-info h3 { font-size: 13px; font-weight: 700; color: #ede9fe; }
  .activated-info p  { font-size: 10px; color: #6d28d9; margin-top: 2px; font-family: 'Courier New', monospace; letter-spacing: 1px; }

  /* Controls panel */
  .controls-panel {
    background: #0d0b1a; border: 1px solid #1e1830;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
  }
  .controls-title {
    font-size: 10px; font-weight: 600; color: #4c1d95;
    letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 8px;
  }
  .controls-list { display: flex; flex-direction: column; gap: 5px; }
  .ctrl-row { display: flex; align-items: center; justify-content: space-between; }
  .ctrl-desc { font-size: 11px; color: #6b5fa0; }
  .ctrl-keys { display: flex; gap: 3px; align-items: center; }
  .kbd {
    background: #1a1628; border: 1px solid #2d1f5e; border-bottom-width: 2px;
    border-radius: 4px; color: #a78bfa; font-family: 'Courier New', monospace;
    font-size: 10px; padding: 2px 6px; white-space: nowrap;
  }
  .kbd-sep { font-size: 9px; color: #2d1f5e; }

  /* Card */
  .card {
    background: #12101f; border: 1px solid #1e1830;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
  }
  .card-row { display: flex; align-items: center; justify-content: space-between; }
  .card-label { font-size: 12px; color: #8b5cf6; display: flex; align-items: center; gap: 5px; }
  .card-label small { display: block; color: #4c1d95; font-size: 10px; margin-top: 2px; }

  /* ⓘ tooltip */
  .info {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid #2d1f5e; color: #4c1d95;
    font-size: 9px; cursor: default; position: relative; flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s; font-family: serif; font-style: normal;
  }
  .info:hover { border-color: #7c3aed; color: #a78bfa; }
  .info::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 7px); left: 50%;
    transform: translateX(-50%);
    background: #1a1628; border: 1px solid #2d1f5e;
    color: #c4b5fd; font-size: 10px; line-height: 1.45;
    padding: 6px 9px; border-radius: 6px; white-space: normal; width: 190px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 9999;
    font-family: system-ui, sans-serif;
  }
  .info::before {
    content: ""; position: absolute; bottom: calc(100% + 2px); left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #2d1f5e;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 9999;
  }
  .info:hover::after, .info:hover::before { opacity: 1; }

  /* Toggle */
  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; margin-left: 10px; }
  .switch input { display: none; }
  .slider {
    position: absolute; inset: 0; background: #1e1830;
    border-radius: 20px; cursor: pointer; transition: background 0.2s; border: 1px solid #2d1f5e;
  }
  .slider:before {
    content: ""; position: absolute; width: 14px; height: 14px;
    left: 2px; top: 2px; background: #4c1d95; border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .switch input:checked + .slider { background: #4c1d95; border-color: #7c3aed; }
  .switch input:checked + .slider:before { transform: translateX(16px); background: #a78bfa; }

  .field-badge {
    background: #1e1830; border: 1px solid #2d1f5e; border-radius: 3px;
    color: #a78bfa; font-size: 9px; padding: 1px 5px; margin-left: 4px;
    vertical-align: middle; letter-spacing: 0.3px; text-transform: uppercase;
  }
  .field-input-wrap { display: flex; gap: 6px; margin-top: 8px; }
  .field-input-wrap input[type="text"] {
    text-align: left; letter-spacing: 0.5px; font-size: 11px; padding: 6px 10px; flex: 1;
  }
  .field-save-btn {
    width: auto; margin: 0; padding: 6px 12px; font-size: 11px;
    background: #1e1830; border: 1px solid #2d1f5e; box-shadow: none;
  }
  .field-save-btn:hover { background: #2d1f5e; box-shadow: none; }
  .field-status { font-size: 10px; min-height: 14px; margin-top: 4px; color: #6d28d9; }
  .field-status.saved { color: #a78bfa; }

  /* Keybind recorder */
  .keybind-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .keybind-row { display: flex; align-items: center; gap: 8px; }
  .keybind-label { font-size: 11px; color: #6b5fa0; width: 80px; flex-shrink: 0; }
  .keybind-input {
    flex: 1; background: #0d0b1a; border: 1px solid #2d1f5e; border-radius: 5px;
    color: #a78bfa; font-family: 'Courier New', monospace; font-size: 11px;
    padding: 5px 8px; outline: none; cursor: pointer; text-align: center;
    letter-spacing: 0.5px; transition: border-color 0.15s;
    user-select: none;
  }
  .keybind-input:focus, .keybind-input.recording {
    border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.2);
    color: #c4b5fd;
  }
  .keybind-clear {
    width: auto; margin: 0; padding: 4px 8px; font-size: 10px;
    background: transparent; border: 1px solid #1e1830;
    box-shadow: none; color: #4c1d95;
  }
  .keybind-clear:hover { background: transparent; border-color: #7f1d1d; color: #f87171; box-shadow: none; }

  .clear-btn {
    width: 100%; background: transparent; border: 1px solid #1e1830;
    border-radius: 6px; color: #4c1d95; font-size: 11px; padding: 7px;
    margin-top: 4px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .clear-btn:hover { color: #f87171; border-color: #7f1d1d; }

  /* Update banner */
  .update-banner {
    display: none;
    background: linear-gradient(135deg, #1a0f2e, #12101f);
    border: 1px solid #7c3aed;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
    position: relative;
  }
  .update-banner.visible { display: block; }
  .update-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .update-pill {
    background: #7c3aed; color: #fff;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.8px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 10px;
  }
  .update-version { font-size: 10px; color: #6d28d9; }
  .update-changelog {
    font-size: 11px; color: #a78bfa; line-height: 1.5;
    margin-bottom: 8px; white-space: pre-wrap;
  }
  .update-btn {
    width: 100%; margin: 0;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    border: none; border-radius: 5px; color: #fff;
    font-size: 11px; font-weight: 600; padding: 7px;
    cursor: pointer; box-shadow: 0 2px 8px rgba(124,58,237,0.4);
  }
  .update-btn:hover { opacity: 0.88; }
</style>
</head>
<body>

<!-- Not activated -->
<div id="activate-view">
  <div class="header">
    <div class="logo">&#128065;</div>
    <div class="header-text"><h1>StealthAI</h1><p>Activate License</p></div>
  </div>
  <div class="body">
    <div class="label">License Key</div>
    <input type="text" id="key-input" placeholder="XXXX-XXXX-XXXX-XXXX" spellcheck="false" autocomplete="off">
    <button id="activate-btn">Activate</button>
    <div class="status" id="status"></div>
  </div>
</div>

<!-- Activated -->
<div id="activated-view">
  <div class="header">
    <div class="logo">&#128065;</div>
    <div class="header-text"><h1>StealthAI</h1><p>Active &amp; Ready</p></div>
  </div>
  <div class="body">

    <div class="activated-header">
      <div class="activated-badge">&#10003;</div>
      <div class="activated-info">
        <h3>License Active</h3>
        <p id="key-display"></p>
      </div>
    </div>

    <!-- Update banner -->
    <div class="update-banner" id="update-banner">
      <div class="update-top">
        <span class="update-pill">&#9650; Update Available</span>
        <span class="update-version" id="update-version"></span>
      </div>
      <div class="update-changelog" id="update-changelog"></div>
      <button class="update-btn" id="update-btn">View Update Instructions</button>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <div class="controls-title">Controls</div>
      <div class="controls-list">
        <div class="ctrl-row">
          <span class="ctrl-desc">Capture area</span>
          <div class="ctrl-keys" id="display-capture">
            <span class="kbd">Ctrl</span><span class="kbd-sep">+</span><span class="kbd">Shift</span><span class="kbd-sep">+</span><span class="kbd">Z</span>
          </div>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-desc">Custom prompt</span>
          <div class="ctrl-keys" id="display-prompt">
            <span class="kbd">Ctrl</span><span class="kbd-sep">+</span><span class="kbd">Shift</span><span class="kbd-sep">+</span><span class="kbd">Space</span>
          </div>
        </div>
        <div class="ctrl-row">
          <span class="ctrl-desc">Dismiss / cancel</span>
          <div class="ctrl-keys"><span class="kbd">Esc</span></div>
        </div>
      </div>
    </div>

    <!-- Keybinds -->
    <div class="card">
      <div class="card-row">
        <div class="card-label">
          Keybinds
          <i class="info" data-tip="Click a field and press any key combination to set a custom shortcut. These override the defaults above. Leave blank to use defaults.">i</i>
        </div>
      </div>
      <div class="keybind-grid">
        <div class="keybind-row">
          <span class="keybind-label">Capture</span>
          <div class="keybind-input" id="bind-capture" tabindex="0">Default</div>
          <button class="keybind-clear" id="bind-capture-clear">✕</button>
        </div>
        <div class="keybind-row">
          <span class="keybind-label">Prompt</span>
          <div class="keybind-input" id="bind-prompt" tabindex="0">Default</div>
          <button class="keybind-clear" id="bind-prompt-clear">✕</button>
        </div>
      </div>
    </div>



    <!-- Camouflage -->
    <div class="card">
      <div class="card-row">
        <div class="card-label">
          Camouflage Mode
          <i class="info" data-tip="Samples the colour behind your selection and renders the answer box to match. Also makes the selection outline and loading indicator subtle grey.">i</i>
        </div>
        <label class="switch">
          <input type="checkbox" id="camo-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button class="clear-btn" id="clear-btn">Deactivate / Change Key</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
