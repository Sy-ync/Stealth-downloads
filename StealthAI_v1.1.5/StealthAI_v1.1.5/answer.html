<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: #0a0a0f;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: stretch;
  }

  .accent {
    width: 3px;
    min-width: 3px;
    background: linear-gradient(180deg, #7c3aed, #4c1d95);
    flex-shrink: 0;
  }

  .content {
    padding: 9px 14px;
    color: #e9d5ff;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="content" id="box"></div>
  <script src="answer.js"></script>
</body>
</html>
